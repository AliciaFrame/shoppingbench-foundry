name: CI

on:
  push:
    branches: [main, remediation/v2-rft-hardening]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[agents,dev]"

      - name: Regenerate deterministic artifacts
        run: |
          python data/scripts/prepare.py
          python rft/scripts/prepare_data.py
          python -m rft.scripts.prepare_live_web_data \
            --evidence rft/data/web-search/captures.jsonl \
            --review rft/data/web-search/review.json \
            --output-dir rft/data/web-search
          python evals/scripts/build_release_summary.py
          python evals/scripts/compare_model_costs.py --check
          git diff --exit-code -- data/prepared evals/datasets rft/data
          git diff --exit-code -- evals/results/summary.json

      - name: Test
        run: python -m pytest --ignore=tests/test_mai_hillclimb_journey.py

      - name: Lint
        run: python -m ruff check .

      - name: Smoke-test agent configurations
        env:
          MAI_OPENAI_BASE_URL: https://example.openai.azure.com/openai/v1
          OTEL_SDK_DISABLED: "true"
          SHOPPINGBENCH_API_TOKEN: test-token
          SHOPPINGBENCH_TOOL_URL: http://localhost:8000
        run: |
          for task in product shop voucher web; do
            SHOPPINGBENCH_TASK=$task OPTIMIZATION_LOCAL_DIR=$task/optimized \
              python -c "import agents.${task}.main; from agents.shared.runtime import config, TOOLS; assert config.source == 'local'; assert len(TOOLS) == 4"
          done
          MAI_API_KEY=test-key MAI_MODEL_DEPLOYMENT_NAME=web-search \
            OPTIMIZATION_LOCAL_DIR=web_search/optimized \
            python -c "import agents.web_search.main; from agents.shared.web_search_runtime import config, TOOLS; assert config.source == 'web-search-baseline'; assert len(TOOLS) == 4"

      - name: Materialize optimizer configuration
        run: |
          python optimize/run.py product \
            --round 1 \
            --agent-version 1 \
            --eval-model judge \
            --optimization-model optimizer \
            --dry-run

      - name: Compile Bicep
        run: az bicep build --file azure/infra/main.bicep --stdout > /dev/null

  skill-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            .github/skills/mai-agent-hillclimb/assets/starter/requirements.txt
            .github/skills/mai-agent-hillclimb/scripts/requirements-cloud.txt
      - name: Install standalone skill dependencies
        run: |
          python -m pip install pytest ruff \
            -r .github/skills/mai-agent-hillclimb/assets/starter/requirements.txt \
            -r .github/skills/mai-agent-hillclimb/scripts/requirements-cloud.txt
      - name: Test standalone skill and security boundaries
        env:
          OTEL_SDK_DISABLED: "true"
        run: python -m pytest tests/test_mai_hillclimb_skill.py tests/test_mai_hillclimb_journey.py
      - name: Lint standalone skill
        run: python -m ruff check .github/skills/mai-agent-hillclimb/scripts .github/skills/mai-agent-hillclimb/assets/starter
