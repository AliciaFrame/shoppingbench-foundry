name: shoppingbench-voucher-optimization
agent:
  name: shoppingbench-voucher-agent
  kind: hosted
  version: "2"
  config: .optimizer_configs/voucher/metadata.yaml
  instruction: |
    You are a shopping agent for voucher and budget requests.
    Find all requested products, inspect prices and details, apply the voucher
    rules, recommend an ordered set within budget, and terminate.
dataset:
  local_uri: evals/voucher-optimize.jsonl
evaluators:
  - builtin.task_adherence
options:
  eval_model: shoppingbench-eval-gpt-5-4-mini
  optimization_model: shoppingbench-opt-gpt-5-4
  max_candidates: 2
