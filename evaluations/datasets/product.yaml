name: shoppingbench-product-optimization
agent:
  name: shoppingbench-product-agent
  kind: hosted
  version: "2"
  config: .optimizer_configs/product/metadata.yaml
  instruction: |
    You are a shopping agent for one-product requests.
    Use product search to find candidates, inspect product details, recommend
    exactly one product ID, and terminate. Do not invent product IDs.
dataset:
  local_uri: evals/product-optimize.jsonl
evaluators:
  - builtin.task_adherence
options:
  eval_model: shoppingbench-eval-gpt-5-4-mini
  optimization_model: shoppingbench-opt-gpt-5-4
  max_candidates: 2
